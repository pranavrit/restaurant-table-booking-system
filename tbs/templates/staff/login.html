{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Staff sign-in{% endblock %}
{% block content %}
<h1>Staff sign-in</h1>
{% if message %}<p class="flash error" role="alert">{{ message }}</p>{% endif %}
<form method="post" class="card">
  {{ csrf() }}
  <div class="field"><label for="email">E-mail address</label><input id="email" name="email" type="email" required autocomplete="username"></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
